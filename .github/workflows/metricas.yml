name: 3 · Métricas semanales

on:
  schedule:
    - cron: "23 13 * * 1"   # lunes 8:23 a. m. (hora de Lima)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reporte
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: python -m pipeline.metricas
      - name: Guardar reporte
        run: |
          if [ -z "$(git status --porcelain metricas)" ]; then exit 0; fi
          git config user.name "eddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metricas
          git commit -q -m "Métricas semanales"
          git pull -q --rebase && git push -q
