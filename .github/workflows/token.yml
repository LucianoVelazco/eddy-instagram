name: 4 · Probar conexión con Instagram

# Verifica que el token y el ID de la cuenta funcionen. Se ejecuta a mano y el día 1 de cada mes.
on:
  schedule:
    - cron: "41 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conexion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar conexión
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: python -m pipeline.token
