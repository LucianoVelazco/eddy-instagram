name: 2 · Publicar en Instagram

# Cada hora revisa el calendario y publica lo aprobado cuya fecha y hora (Lima) ya llegó.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo simular (no publica nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar lo que toca
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          if [ "$SIMULAR" = "true" ]; then python -m pipeline.publicar --simular; else python -m pipeline.publicar; fi

      - name: Guardar el calendario actualizado
        run: |
          if [ -z "$(git status --porcelain calendario)" ]; then exit 0; fi
          git config user.name "eddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendario/calendario.csv
          git commit -q -m "Publicación: calendario actualizado"
          git pull -q --rebase && git push -q
